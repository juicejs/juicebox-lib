<app-sidenav-container class="modern-sidebar-container"
                       [class.collapsed]="juicebox.collapsed">

  <app-sidenav opened mode="side" class="modern-sidebar">

    <!-- Logo Section -->
    <div class="sidebar-header">
      <img ngSrc="assets/juicebar/images/logo_small.png"
           alt="Logo"
           width="120" height="120"
           class="brand-logo"
           [class.vertical]="juicebox.collapsed">
      <button class="collapse-btn"
              (click)="collapse()"
              [appTooltip]="juicebox.collapsed ? 'Expand sidebar' : 'Collapse sidebar'"
              appTooltipPosition="right">
        <app-icon class="collapse-icon"
                  [class.flipped]="juicebox.collapsed"
                  [icon]="'chevron_left'"></app-icon>
      </button>
    </div>

    <!-- Navigation Menu with Drag & Drop -->
    <div class="sidebar-menu" 
         cdkDropList
         (cdkDropListDropped)="onMenuDrop($event)"
         [cdkDropListDisabled]="!juicebox.getOptions().sidebarPermissions">
         
      <div class="menu-section">
        @for (menuItem of menu(); track trackByRole($index, menuItem)) {
          <div class="menu-item-container"
             cdkDrag
             [cdkDragDisabled]="!juicebox.getOptions().sidebarPermissions"
             (cdkDragStarted)="onMenuDragStarted()">

          <div class="menu-item"
               [class.active]="isActiveRoute(menuItem.router)"
               [class.dragging]="isDragging()"
               (click)="menuItemClicked($event, menuItem.router)"
               [appTooltip]="juicebox.collapsed ? menuItem.label : ''"
               appTooltipPosition="right">

            <div class="menu-item-content">
              <div class="menu-icon-container">
                @if (!isDragging()) {
                  <app-icon class="menu-icon" [icon]="getMatIcon(menuItem.icon)"></app-icon>
                }
                @if (isDragging()) {
                  <app-icon class="drag-handle" [icon]="'drag_indicator'"></app-icon>
                }
              </div>

              <span class="menu-label" [class.collapsed]="juicebox.collapsed">
                {{menuItem.label}}
              </span>
            </div>
          </div>
          </div>
        }
      </div>
    </div>

    <!-- Sidebar Footer -->
    <div class="sidebar-footer" [class.collapsed]="juicebox.collapsed">
      <button class="user-section"
              [class.collapsed]="juicebox.collapsed"
              (click)="goToProfile()"
              [appTooltip]="'view_profile' | translate"
              appTooltipPosition="right">
        <div class="user-avatar-initials">{{ userInitials() }}</div>
        @if (!juicebox.collapsed) {
          <div class="user-info">
            <div class="user-full-name">{{ userDisplayName() }}</div>
            <div class="user-org">{{ organisationName() }}</div>
          </div>
        }
      </button>

      <button class="logout-btn"
              (click)="logout()"
              [appTooltip]="'logout' | translate"
              appTooltipPosition="right">
        <app-icon [icon]="'logout'"></app-icon>
      </button>
    </div>

  </app-sidenav>

</app-sidenav-container>

<!-- Profile Picture Dialog -->
<ng-template #picture let-modal>
  <app-dialog-content>
    <app-dialog-title>
      {{userName()}} - {{'profile_picture' | translate}}
    </app-dialog-title>

    <div class="profile-upload-section">
      <input (change)="fileChangeEvent($event)"
             accept="image/*"
             type="file"
             class="file-input"/>

      @if (imageChangedEvent()) {
      <div class="cropper-section">
        <image-cropper
          [imageChangedEvent]="imageChangedEvent()"
          [maintainAspectRatio]="true"
          [aspectRatio]="1"
          [resizeToWidth]="128"
          [resizeToHeight]="128"
          [roundCropper]="true"
          format="png"
          (imageCropped)="imageCropped($event)">
        </image-cropper>
      </div>
      }

      @if (croppedImage()) {
      <div class="preview-section">
        <div class="user-logo">
          <img [src]="croppedImage()" class="user-placeholder" alt="Profile Preview" />
        </div>
      </div>
      }
    </div>
  </app-dialog-content>

  <app-dialog-actions align="end">
    <button app-button (click)="modal.close()">
      {{'cancel' | translate}}
    </button>
    <button app-button
            appearance="raised"
            color="primary"
            (click)="updateProfilePicture(modal)"
            [promiseBtn]="promiseBtn"
            [disabled]="!croppedImage()">
      {{'save' | translate}}
    </button>
  </app-dialog-actions>
</ng-template>
