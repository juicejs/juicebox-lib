<app-sidenav-container class="modern-sidebar-container"
                       [class.collapsed]="collapsed()">

  <app-sidenav opened mode="side" class="modern-sidebar">

    <!-- Navigation Menu with Drag & Drop -->
    <div class="sidebar-menu" 
         cdkDropList
         (cdkDropListDropped)="onMenuDrop($event)"
         [cdkDropListDisabled]="!juicebox.getOptions().sidebarPermissions">
         
      <div class="menu-section">
        @for (menuItem of menu(); track trackByRole($index, menuItem)) {
          <!-- The item moved stays in the sidebar, so it keeps the sidebar's look -->
          <div class="menu-item-container"
             cdkDrag
             cdkDragPreviewContainer="parent"
             [cdkDragDisabled]="!juicebox.getOptions().sidebarPermissions">

          <a class="menu-item"
             [routerLink]="'/main/' + menuItem.router"
             routerLinkActive="active"
             ariaCurrentWhenActive="page"
             [appTooltip]="collapsed() ? menuItem.label : ''"
             appTooltipPosition="right">

            <div class="menu-item-content">
              <div class="menu-icon-container">
                <app-icon class="menu-icon" [icon]="menuItem.icon | matIcon"></app-icon>
              </div>

              <span class="menu-label" [class.collapsed]="collapsed()">
                {{menuItem.label}}
              </span>

              <!-- The project's number for the module, where it gives one -->
              @let count = counts()[menuItem.id];
              @if (count !== undefined && !collapsed()) {
                <span class="menu-count">{{ count }}</span>
              }
            </div>
          </a>
          </div>
        }
      </div>
    </div>

  </app-sidenav>

</app-sidenav-container>

<!-- Profile Picture Dialog -->
<ng-template #picture let-modal>
  <app-dialog-content>
    <app-dialog-title>
      {{userName()}} - {{'profile_picture' | translate}}
    </app-dialog-title>

    <div class="profile-upload-section">
      <input (change)="fileChangeEvent($event)"
             accept="image/*"
             type="file"
             class="file-input"/>

      @if (imageChangedEvent()) {
      <div class="cropper-section">
        <image-cropper
          [imageChangedEvent]="imageChangedEvent()"
          [maintainAspectRatio]="true"
          [aspectRatio]="1"
          [resizeToWidth]="128"
          [resizeToHeight]="128"
          [roundCropper]="true"
          format="png"
          output="base64"
          (imageCropped)="imageCropped($event)">
        </image-cropper>
      </div>
      }

      @if (croppedImage()) {
      <div class="preview-section">
        <div class="user-logo">
          <img [src]="croppedImage()" class="user-placeholder" alt="Profile Preview" />
        </div>
      </div>
      }
    </div>
  </app-dialog-content>

  <app-dialog-actions align="end">
    <button app-button (click)="modal.close()">
      {{'cancel' | translate}}
    </button>
    <button app-button
            appearance="raised"
            color="primary"
            (click)="updateProfilePicture(modal)"
            [promiseBtn]="promiseBtn"
            [disabled]="!croppedImage()">
      {{'save' | translate}}
    </button>
  </app-dialog-actions>
</ng-template>
