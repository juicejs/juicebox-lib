@if (location(); as stored) {
  <app-location-fields
    [form]="form"
    [title]="'details' | translate"
    [options]="options"
    [types]="types()"
    [categories]="categories()"
    [countries]="countries()"
    [web]="web()"
    [archivable]="!stored.cannotArchive"
    [namePlaceholder]="namePlaceholder()"
    [descriptionPlaceholder]="descriptionPlaceholder()"
    (submitted)="save()"
  >
    <button app-button appearance="raised" color="primary" type="submit"
            [disabled]="saveLocked()"
            [promiseBtn]="savePromise()">
      {{ 'save' | translate }}
    </button>
  </app-location-fields>
}
