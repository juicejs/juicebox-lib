<app-location-fields
  [form]="form"
  [title]="'create_location' | translate"
  [options]="options"
  [types]="types()"
  [categories]="categories()"
  [countries]="countries()"
  [web]="web()"
  (submitted)="create()"
>
  <button app-button appearance="raised" color="primary" type="submit"
          [hasPermissions]="'locations:role#create'"
          [promiseBtn]="createPromise()">
    {{ 'create' | translate }}
  </button>
</app-location-fields>
