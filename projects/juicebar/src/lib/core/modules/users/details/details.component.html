<app-tabs [selectedIndex]="selectedTabIndex()" (selectedIndexChange)="onTabChange($event)">
    @for (tab of visibleTabs(); track tab.route) {
        <app-tab [label]="tab.label"></app-tab>
    }
</app-tabs>

<!-- One outlet per user: the tabs are created anew when another user is opened -->
@for (id of [userId()]; track id) {
    <router-outlet></router-outlet>
}
