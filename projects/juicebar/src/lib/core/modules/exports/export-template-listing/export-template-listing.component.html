<div class="parent">
    <app-data-table
        [rows]="rows()"
        [columns]="columns()"
        [totalCount]="count()"
        [pageSize]="pageSize()"
        [pageIndex]="page() - 1"
        [sort]="sort()"
        (pageChange)="onPageChange($event)"
        (sortChange)="onSort($event)"
        (rowClick)="onSelect($event._id)">

        <ng-template [cellDef]="'name'" let-row>
            <a class="dt-row-link" [routerLink]="['/main/exports/edit', row._id]" (click)="$event.stopPropagation()">{{ row.name }}</a>
        </ng-template>

        <ng-template [cellDef]="'columns'" let-row>
            <span [title]="row._columns.length ? (row._columns | columnLabels:true) : null"
                  [class.has-popover]="row._columns.length"
                  class="ellipsis-inner">
                {{ (row._columns | columnLabels) || '-' }}
            </span>
        </ng-template>

        <ng-template [cellDef]="'filters'" let-row>
            <span [title]="row._filters.length ? (row._filters | columnLabels:true) : null"
                  [class.has-popover]="row._filters.length"
                  class="ellipsis-inner">
                {{ (row._filters | columnLabels) || '-' }}
            </span>
        </ng-template>

        <ng-template [cellDef]="'actions'" let-row>
            <div class="dt-row-actions">
                <button [attr.aria-label]="'download' | translate" app-button
                        appearance="icon"
                        [disabled]="!row._available_export_strategies.length"
                        [cdkMenuTriggerFor]="exportMenu"
                        (click)="$event.stopPropagation()"
                        [NoPermissionDisable]="row.data_source_key == 'sap-data:strategy' ? 'data-export:role#admin' : 'data-export:role#export'"
                        [appTooltip]="'export' | translate"
                        class="primary">
                    <app-icon [icon]="'file_download'"></app-icon>
                </button>
                <ng-template #exportMenu>
                    <div class="dropdown-panel dropdown-panel--compact" cdkMenu>
                        <div class="dropdown-panel-options">
                            @for (exportStrategy of row._available_export_strategies; track exportStrategy.key) {
                                <button class="dropdown-option"
                                        cdkMenuItem
                                        (click)="openExportConfirmationModal(row, exportStrategy.key)">
                                    {{exportStrategy.name}}
                                </button>
                            }
                        </div>
                    </div>
                </ng-template>
                <button [attr.aria-label]="'delete' | translate" app-button
                        appearance="icon"
                        (click)="$event.stopPropagation(); delete(row)"
                        [NoPermissionDisable]="'data-export:role#delete'"
                        [appTooltip]="'delete' | translate"
                        class="danger">
                    <app-icon [icon]="'delete'"></app-icon>
                </button>
            </div>
        </ng-template>
    </app-data-table>
</div>
