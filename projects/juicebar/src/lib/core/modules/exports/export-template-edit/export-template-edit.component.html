<div class="parent">
    <!-- A new editor for each template -->
    @if (template(); as current) {
        @for (shown of [current]; track shown._id) {
            <app-export-template-editor
                [template]="shown"
                [submitLabel]="'save' | translate"
                [canSubmit]="canUpdate"
                [busy]="savePromise()"
                (submitted)="save($event)" />
        }
    }
</div>
