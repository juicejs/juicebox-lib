<app-dialog-title>{{ 'confirm_export' | translate }}</app-dialog-title>

@if (loading()) {
    <app-dialog-content class="export-loading">
        <app-progress-spinner [diameter]="32" />
        <p>{{ 'loading' | translate }}</p>
    </app-dialog-content>
    <app-dialog-actions>
        <button app-button type="button" (click)="cancel()">{{ 'cancel' | translate }}</button>
    </app-dialog-actions>
} @else {
    <app-dialog-content>
        <app-form-field appearance="outline">
            <app-label>{{ 'file_name' | translate }}</app-label>
            <input appInput type="text" [formControl]="fileName" [placeholder]="'file_name' | translate">
        </app-form-field>

        @if (filters(); as editable) {
            <app-export-filters [filters]="editable" (filtersValueChange)="onFiltersValueChange($event)" />
        }
    </app-dialog-content>

    <app-dialog-actions>
        <button app-button type="button" (click)="cancel()">{{ 'cancel' | translate }}</button>
        <button app-button appearance="raised" color="primary" type="button"
                [promiseBtn]="exportPromise()"
                (click)="export()">
            {{ 'download' | translate }}
        </button>
    </app-dialog-actions>
}
