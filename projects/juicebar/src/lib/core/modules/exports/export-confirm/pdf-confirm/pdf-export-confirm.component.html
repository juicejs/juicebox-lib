<app-dialog-title>{{ 'confirm_export' | translate }}</app-dialog-title>

<app-dialog-content>
    <app-form-field appearance="outline">
        <app-label>{{ 'zip_file_name' | translate }}</app-label>
        <input appInput type="text" [formControl]="fileName" [placeholder]="'zip_file_name' | translate">
    </app-form-field>

    <app-form-field appearance="outline">
        <app-label>{{ 'file_name' | translate }}</app-label>
        <app-select [value]="fileNameColumn()"
                    (selectionChange)="fileNameColumn.set($event.value)"
                    [clearable]="true"
                    [searchable]="true"
                    [placeholder]="'file_name' | translate"
                    [searchPlaceholder]="'search' | translate">
            @for (column of fileNameColumns(); track column.id) {
                <app-option [value]="column.id">{{ (column.label || column.id) | autoLanguage }}</app-option>
            }
        </app-select>
    </app-form-field>
</app-dialog-content>

<app-dialog-actions>
    <button app-button type="button" (click)="cancel()">{{ 'cancel' | translate }}</button>
    <button app-button appearance="raised" color="primary" type="button"
            [promiseBtn]="exportPromise()"
            (click)="export()">
        {{ 'download' | translate }}
    </button>
</app-dialog-actions>
