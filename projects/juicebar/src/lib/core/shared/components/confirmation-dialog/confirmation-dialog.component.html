@if (title) {
  <app-dialog-title>
    <span [innerHTML]="title"></span>
  </app-dialog-title>
}

<app-dialog-content>
  <p class="dialog-message" [innerHTML]="(completeMessage ?  (excludeQuestionMark ? completeMessage : completeMessage + '?') :  (message || ('are_you_sure' | translate)) + ' ' + (action || '') + ' ' + (subject || '') + '?')"></p>
  @if (info) {
    <p class="dialog-info" [innerHTML]="info"></p>
  }
</app-dialog-content>

<app-dialog-actions align="end">
  <button app-button
          appearance="flat"
          (click)="dialogRef.close(false)"
          type="button">
    {{cancel | translate}}
  </button>
  <button app-button
          appearance="raised"
          color="primary"
          (click)="dialogRef.close(true)"
          type="button">
    {{confirm | translate}}
  </button>
</app-dialog-actions>
