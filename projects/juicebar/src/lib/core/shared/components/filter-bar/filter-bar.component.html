<div class="filter-bar">
  @for (filter of filters(); track filter.key) {
    <div class="filter-button" [class.active]="filter.selectedValue">
      <button app-button
              class="filter-btn"
              cdkOverlayOrigin
              #trigger="cdkOverlayOrigin"
              (click)="toggle(filter.key)">
        <app-icon [icon]="filter.icon" class="filter-icon"></app-icon>
        <span class="filter-label">{{ filter.label }}</span>
        @if (filter.selectedValue) {
          <span class="filter-value">
            <span class="filter-value__label">{{ filter.displayProperty ? filter.selectedValue[filter.displayProperty] : filter.selectedValue }}</span>
            <button type="button"
                    class="filter-value__remove"
                    [attr.aria-label]="'Remove ' + (filter.displayProperty ? filter.selectedValue[filter.displayProperty] : filter.selectedValue)"
                    (click)="clearSelection(filter.key, $event)">
              <svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4l8 8M12 4l-8 8"/></svg>
            </button>
          </span>
        }
        <svg class="dropdown-icon" width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m4 6 4 4 4-4"/></svg>
      </button>

      <ng-template cdkConnectedOverlay
                   [cdkConnectedOverlayOrigin]="trigger"
                   [cdkConnectedOverlayOpen]="openKey() === filter.key"
                   [cdkConnectedOverlayHasBackdrop]="true"
                   cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
                   (backdropClick)="close()">
        <div class="filter-panel">
          <div class="autocomplete-search-container">
            <app-icon [icon]="'search'" class="search-icon"></app-icon>
            <input class="autocomplete-search-input"
                   [placeholder]="filter.placeholder"
                   (input)="onFilterSearch(filter.key, $any($event.target).value)" />
          </div>

          <div class="filter-options-list">
            <button class="filter-option filter-option-clear" type="button"
                    (click)="onFilterSelected(filter.key, null)">
              <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h10M5 6v7a1 1 0 0 0 1 1h4a1 1 0 0 0 1-1V6M6 6V4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v2"/></svg>
              <span class="filter-option-label">Clear selection</span>
            </button>

            @if (filter.options.length === 0) {
              <div class="filter-option disabled">No results found</div>
            }

            @for (option of filter.options; track option) {
              <button class="filter-option" type="button"
                      [class.filter-option-selected]="filter.selectedValue === option || (filter.displayProperty && filter.selectedValue?.[filter.displayProperty] === option?.[filter.displayProperty])"
                      (click)="onFilterSelected(filter.key, option)">
                <span class="filter-option-label">{{ filter.displayProperty ? option[filter.displayProperty] : option }}</span>
                @if (filter.selectedValue === option || (filter.displayProperty && filter.selectedValue?.[filter.displayProperty] === option?.[filter.displayProperty])) {
                  <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="#f97316" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 8 3 3 7-7"/></svg>
                }
              </button>
            }
          </div>
        </div>
      </ng-template>
    </div>
  }
</div>
