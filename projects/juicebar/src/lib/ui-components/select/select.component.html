<div class="app-select" [class.app-select-clearable]="showClear()" cdkOverlayOrigin #trigger="cdkOverlayOrigin">
  <button
    #triggerButton
    type="button"
    class="app-select-trigger"
    [attr.id]="triggerId?.()"
    [disabled]="isDisabled()"
    [class.disabled]="isDisabled()"
    [class.open]="isOpen()"
    (click)="toggle()"
    (keydown)="onKeydown($event)"
    (blur)="onTriggerBlur()"
    role="combobox"
    aria-haspopup="listbox"
    [attr.aria-expanded]="isOpen()"
    [attr.aria-controls]="isOpen() ? panelId : null"
    [attr.aria-activedescendant]="searchable() ? null : activeOptionId()">
    @if (multiple()) {
      @if (selectedCount() > 0) {
        <span class="app-select-chips">
          @for (label of selectedLabels(); track label) {
            <span class="app-select-chip">{{ label }}</span>
          }
        </span>
      } @else {
        <span class="app-select-placeholder">{{ placeholder() }}</span>
      }
    } @else {
      @if (displayValue()) {
        <span class="app-select-value">{{ displayValue() }}</span>
      } @else {
        <span class="app-select-placeholder">{{ placeholder() }}</span>
      }
    }
    <svg class="app-select-chevron" [class.rotated]="isOpen()" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="6 9 12 15 18 9"></polyline>
    </svg>
  </button>
  @if (showClear()) {
    <button type="button" class="app-select-clear" [attr.aria-label]="clearLabel()" [title]="clearLabel()" (click)="clear()">
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
  }
</div>

<div hidden>
  <ng-content></ng-content>
</div>

<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="trigger"
  [cdkConnectedOverlayOpen]="isOpen()"
  [cdkConnectedOverlayHasBackdrop]="false"
  (overlayOutsideClick)="close()"
  (detach)="close()">
  <div class="app-select-panel" [class.app-select-panel-multi]="multiple()">
    @if (searchable()) {
      <div class="app-select-search">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input [attr.aria-label]="searchPlaceholder()"
          #searchInput
          class="app-select-search-input"
          type="text"
          role="combobox"
          aria-autocomplete="list"
          aria-expanded="true"
          [attr.aria-controls]="panelId"
          [attr.aria-activedescendant]="activeOptionId()"
          [placeholder]="searchPlaceholder()"
          [ngModel]="searchQuery()"
          (ngModelChange)="setSearchQuery($event)"
          (keydown)="onKeydown($event)"
          (click)="$event.stopPropagation()" />
      </div>
    }
    @if (multiple()) {
      <div class="app-select-multi-actions">
        <button type="button" class="app-select-action-btn" (click)="selectAll()">Select all</button>
        <button type="button" class="app-select-action-btn" (click)="clearAll()">Clear all</button>
      </div>
    }
    <div #optionsList class="app-select-options" role="listbox" [attr.id]="panelId" [attr.aria-multiselectable]="multiple() || null"
         (scroll)="onOptionsScroll($event)">
      @if (filteredOptions().length === 0) {
        <div class="app-select-empty">No results</div>
      } @else {
        @for (item of renderedOptions(); track item.option.value(); let i = $index) {
          @let option = item.option;
          <div class="app-option"
               [attr.id]="optionIdPrefix + i"
               [class.app-option-selected]="item.selected"
               [class.app-option-active]="i === activeIndex()"
               [class.app-option-disabled]="option.disabled()"
               (mousedown)="$event.preventDefault()"
               (mouseenter)="activeIndex.set(i)"
               (click)="select(option)"
               role="option"
               [attr.aria-selected]="item.selected"
               [attr.aria-disabled]="option.disabled()">
            <span class="app-option-label">{{ option.getLabel() }}</span>
            @if (item.selected) {
              <svg class="app-option-check" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="m3 8 3 3 7-7"/>
              </svg>
            }
          </div>
        }
      }
    </div>
  </div>
</ng-template>
