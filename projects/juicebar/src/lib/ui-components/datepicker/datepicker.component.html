<div #field class="app-picker-field" [class.app-picker-field-clearable]="showClear()" cdkOverlayOrigin #origin="cdkOverlayOrigin">
  <input #textInput
         type="text"
         class="app-picker-input"
         autocomplete="off"
         [attr.id]="inputId?.()"
         [attr.aria-haspopup]="readonly() ? 'dialog' : null"
         [attr.aria-expanded]="readonly() ? isOpen() : null"
         [value]="text()"
         [placeholder]="placeholder()"
         [disabled]="isDisabled()"
         [readOnly]="readonly()"
         (input)="onType(textInput.value)"
         (change)="onTextCommit()"
         (blur)="onInputBlur()"
         (click)="onInputClick()">
  @if (showClear()) {
    <button type="button" class="app-picker-clear" [attr.aria-label]="clearLabel()" [title]="clearLabel()" (click)="clear()">
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
  }
  <button #toggleButton
          type="button"
          class="app-picker-toggle"
          aria-label="Open calendar"
          aria-haspopup="dialog"
          [attr.aria-expanded]="isOpen()"
          [disabled]="isDisabled()"
          (click)="toggle()">
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
      <line x1="16" y1="2" x2="16" y2="6"></line>
      <line x1="8" y1="2" x2="8" y2="6"></line>
      <line x1="3" y1="10" x2="21" y2="10"></line>
    </svg>
  </button>
</div>

<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="origin"
  [cdkConnectedOverlayOpen]="isOpen()"
  [cdkConnectedOverlayPositions]="positions"
  (overlayOutsideClick)="onOutsideClick()"
  (detach)="close(true)">
  <div class="app-picker-panel" role="dialog" aria-modal="true" aria-label="Choose a date" cdkTrapFocus>
    <app-calendar [selected]="value()"
                  [minDate]="minDate()"
                  [maxDate]="maxDate()"
                  [startDate]="startDate()"
                  [markDisabled]="markDisabled()"
                  [displayMonths]="displayMonths()"
                  [outsideDays]="outsideDays() ?? 'visible'"
                  [showWeekNumbers]="showWeekNumbers()"
                  [dayTemplate]="dayTemplate()"
                  [autoFocus]="true"
                  (dateSelect)="pick($event)" />
    @if (footerTemplate(); as footer) {
      <div class="app-picker-footer">
        <ng-container *ngTemplateOutlet="footer" />
      </div>
    }
  </div>
</ng-template>
