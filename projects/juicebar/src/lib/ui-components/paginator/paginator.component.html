<div class="app-paginator">
  <span class="paginator-range">
    {{ pageIndex() * pageSize() + 1 }}–{{ Math.min((pageIndex() + 1) * pageSize(), length()) }} of {{ length() }}
  </span>

  @if (pageSizeOptions().length > 1) {
    <div class="paginator-size" role="group" [attr.aria-label]="rowsPerPageLabel()">
      <span class="paginator-size-label" aria-hidden="true">{{ rowsPerPageLabel() }}</span>
      <div class="paginator-size-options">
        @for (size of pageSizeOptions(); track size) {
          <button type="button" class="size-option"
                  [class.active]="size === pageSize()"
                  [attr.aria-pressed]="size === pageSize()"
                  (click)="setPageSize(size)">{{ size }}</button>
        }
      </div>
    </div>
  }

  <div class="paginator-pages">
    <button type="button" class="pager-arrow" [attr.aria-label]="previousLabel()" (click)="previousPage()" [disabled]="pageIndex() === 0">
      <svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m10 3-5 5 5 5"/></svg>
    </button>

    @for (p of pages(); track $index) {
      @if (p === '…') {
        <span class="pager-dots">…</span>
      } @else {
        <button type="button" class="pager-num" [class.active]="p === pageIndex() + 1"
                [attr.aria-current]="p === pageIndex() + 1 ? 'page' : null" (click)="goToPage(p)">{{ p }}</button>
      }
    }

    <button type="button" class="pager-arrow" [attr.aria-label]="nextLabel()" (click)="nextPage()" [disabled]="pageIndex() >= totalPages - 1">
      <svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m6 3 5 5-5 5"/></svg>
    </button>
  </div>
</div>
